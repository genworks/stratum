# GitLab CI for genworks/stratum: the Lisp half of the regression suite
# (tests/run.lisp) on a COLD Gendl image, once per implementation.
#
# Each job runs inside a published Gendl image that has never seen this
# repository: ci/run-tests.lisp loads Quicklisp from the image, loads
# Stratum through ASDF from the checkout (a WARNING while it loads fails
# the job), and runs every check -- which edits rebuild the programs,
# layer-type dispatch, the curve, levels and hue/saturation properties,
# rectangles, threaded against single-threaded renders, and the golden
# checksums of the CPU renders, which must be the same on every
# implementation.  Exit status 1 is a failed check, 2 anything else.
#
# The browser half (tests/browser.sh: GPU against CPU in headless
# Chromium) needs a running image and a browser beside it; it runs
# where the stack is, not here, for now.
#
# Runner: the amd64 DOCKER executor (tag "amd64-docker"); the job runs
# in the Gendl image as the image's own user.
#
# The repository is push-mirrored to other GitLab servers that carry
# this file too but have no such runner, where a pipeline would only
# wait for one and fail; so the pipeline exists on the home server
# alone, and the mirrors create none.

workflow:
  rules:
    - if: $CI_SERVER_HOST == "gitlab.genworks.com"

stages:
  - fetch
  - test

# The invite gate, visitor-log and sexp-agent live in Gendl (gwl/source/);
# until the images carry them, the files come from Gendl's repository -- by
# git, which common-lisp.net's bot screen lets through where it answers
# curl with a challenge page (the 2026-11-04 failure: the image read an
# HTML page as Lisp).  The Gendl images have no git, so a job of its
# own fetches the files, a partial clone of a few hundred kilobytes,
# and hands them on as artifacts.
gendl-files:
  stage: fetch
  tags:
    - amd64-docker
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - rm -rf gendl-partial gendl-files
    - git clone --depth 1 --filter=blob:none --no-checkout -b devo https://gitlab.common-lisp.net/gendl/gendl.git gendl-partial
    - git -C gendl-partial checkout devo -- gwl/source/invite-gate.lisp gwl/source/visitor-log.lisp gwl/source/sexp-agent.lisp
    - mkdir gendl-files && cp gendl-partial/gwl/source/invite-gate.lisp gendl-partial/gwl/source/visitor-log.lisp gendl-partial/gwl/source/sexp-agent.lisp gendl-files/
    - for f in gendl-files/*.lisp; do head -c 120 "$f" | grep -q Copyright || { echo "$f is not the Lisp file"; exit 1; }; done
    - git -C gendl-partial log --oneline -1
  artifacts:
    paths:
      - gendl-files/
    expire_in: 1 day

.lisp-tests:
  stage: test
  needs:
    - gendl-files
  tags:
    - amd64-docker
  variables:
    GIT_DEPTH: "1"
    INVITE_GATE_FILE: /tmp/stratum/gendl-files/invite-gate.lisp
    VISITOR_LOG_FILE: /tmp/stratum/gendl-files/visitor-log.lisp
    SEXP_AGENT_FILE: /tmp/stratum/gendl-files/sexp-agent.lisp
  before_script:
    # A private copy: the build directory belongs to the runner's helper,
    # not the image's user.  The fetched Gendl files ride along in it.
    - rm -rf /tmp/stratum && cp -r "$CI_PROJECT_DIR" /tmp/stratum
    - cd /opt/gendl

tests-ccl:
  extends: .lisp-tests
  image: genworks/gendl:devo-ccl
  script:
    - STRATUM_DIR=/tmp/stratum ./gdl/program/gdl-ccl -n -b --load /tmp/stratum/ci/run-tests.lisp

tests-sbcl:
  extends: .lisp-tests
  image: genworks/gendl:devo-sbcl
  script:
    - STRATUM_DIR=/tmp/stratum ./gdl/program/gdl-sbcl --non-interactive --load /tmp/stratum/ci/run-tests.lisp
